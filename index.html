<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memoria - One Piece</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background Elements -->
    <div class="animated-bg">
        <!-- Ocean Waves -->
        <div class="ocean">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
        </div>

        <!-- Floating Elements -->
        <div class="floating-elements">
            <!-- Ships -->
            <div class="pirate-ship ship1"></div>
            <div class="pirate-ship ship2"></div>

            <!-- Bubbles -->
            <div class="bubble bubble1"></div>
            <div class="bubble bubble2"></div>
            <div class="bubble bubble3"></div>
            <div class="bubble bubble4"></div>
            <div class="bubble bubble5"></div>
            <div class="bubble bubble6"></div>
            <div class="bubble bubble7"></div>
            <div class="bubble bubble8"></div>

            <!-- Clouds -->
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>

            <!-- Stars/Sparkles -->
            <div class="sparkle sparkle1"></div>
            <div class="sparkle sparkle2"></div>
            <div class="sparkle sparkle3"></div>
            <div class="sparkle sparkle4"></div>
            <div class="sparkle sparkle5"></div>

            <!-- Skull and Crossbones -->
            <div class="skull skull1"></div>
            <div class="skull skull2"></div>

            <!-- Treasure Coins -->
            <div class="coin coin1"></div>
            <div class="coin coin2"></div>
            <div class="coin coin3"></div>
        </div>
    </div>

    <!-- Tela Inicial -->
    <div id="start-screen" class="screen active">
        <div class="start-container">
            <div class="logo">
                <!-- Straw Hat Jolly Roger Icon -->
                <div class="jolly-roger">
                    <svg viewBox="0 0 100 100" class="jolly-roger-svg">
                        <!-- Skull -->
                        <ellipse cx="50" cy="40" rx="28" ry="25" fill="#fff"/>
                        <ellipse cx="50" cy="45" rx="20" ry="12" fill="#fff"/>
                        <!-- Eyes -->
                        <ellipse cx="40" cy="38" rx="6" ry="7" fill="#000"/>
                        <ellipse cx="60" cy="38" rx="6" ry="7" fill="#000"/>
                        <!-- Nose -->
                        <ellipse cx="50" cy="48" rx="3" ry="4" fill="#000"/>
                        <!-- Smile -->
                        <path d="M 35 55 Q 50 65 65 55" stroke="#000" stroke-width="3" fill="none"/>
                        <!-- Teeth -->
                        <rect x="42" y="54" width="4" height="6" fill="#fff" stroke="#000" stroke-width="1"/>
                        <rect x="48" y="54" width="4" height="6" fill="#fff" stroke="#000" stroke-width="1"/>
                        <rect x="54" y="54" width="4" height="6" fill="#fff" stroke="#000" stroke-width="1"/>
                        <!-- Straw Hat -->
                        <ellipse cx="50" cy="22" rx="35" ry="10" fill="#8B4513"/>
                        <ellipse cx="50" cy="18" rx="25" ry="15" fill="#DAA520"/>
                        <path d="M 25 18 Q 50 5 75 18" stroke="#8B4513" stroke-width="3" fill="none"/>
                        <line x1="30" y1="16" x2="30" y2="22" stroke="#8B4513" stroke-width="1"/>
                        <line x1="40" y1="14" x2="40" y2="20" stroke="#8B4513" stroke-width="1"/>
                        <line x1="50" y1="13" x2="50" y2="19" stroke="#8B4513" stroke-width="1"/>
                        <line x1="60" y1="14" x2="60" y2="20" stroke="#8B4513" stroke-width="1"/>
                        <line x1="70" y1="16" x2="70" y2="22" stroke="#8B4513" stroke-width="1"/>
                        <!-- Red Band -->
                        <rect x="25" y="19" width="50" height="4" fill="#DC143C" rx="2"/>
                        <!-- Crossbones -->
                        <line x1="15" y1="70" x2="85" y2="90" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
                        <line x1="85" y1="70" x2="15" y2="90" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
                        <circle cx="15" cy="70" r="5" fill="#fff"/>
                        <circle cx="85" cy="70" r="5" fill="#fff"/>
                        <circle cx="15" cy="90" r="5" fill="#fff"/>
                        <circle cx="85" cy="90" r="5" fill="#fff"/>
                    </svg>
                </div>
                <h1 class="game-title">Jogo da Memoria</h1>
                <p class="subtitle">One Piece Edition</p>
            </div>

            <div class="difficulty-select">
                <h3>Escolha a Dificuldade</h3>
                <div class="difficulty-buttons">
                    <button class="btn-difficulty" data-difficulty="easy">
                        <span class="diff-name">Facil</span>
                        <span class="diff-info">4 pares</span>
                    </button>
                    <button class="btn-difficulty active" data-difficulty="medium">
                        <span class="diff-name">Medio</span>
                        <span class="diff-info">6 pares</span>
                    </button>
                    <button class="btn-difficulty" data-difficulty="hard">
                        <span class="diff-name">Dificil</span>
                        <span class="diff-info">8 pares</span>
                    </button>
                </div>
            </div>

            <button id="btn-start" class="btn-primary">
                Jogar
            </button>

            <button id="btn-leaderboard" class="btn-secondary">
                Ver Placar
            </button>
        </div>
    </div>

    <!-- Tela do Jogo -->
    <div id="game-screen" class="screen">
        <header class="game-header">
            <div class="header-left">
                <div class="header-logo">
                    <svg viewBox="0 0 100 100" class="header-skull-svg">
                        <ellipse cx="50" cy="40" rx="28" ry="25" fill="#fff"/>
                        <ellipse cx="50" cy="45" rx="20" ry="12" fill="#fff"/>
                        <ellipse cx="40" cy="38" rx="6" ry="7" fill="#000"/>
                        <ellipse cx="60" cy="38" rx="6" ry="7" fill="#000"/>
                        <ellipse cx="50" cy="48" rx="3" ry="4" fill="#000"/>
                        <path d="M 35 55 Q 50 65 65 55" stroke="#000" stroke-width="3" fill="none"/>
                        <ellipse cx="50" cy="22" rx="35" ry="10" fill="#8B4513"/>
                        <ellipse cx="50" cy="18" rx="25" ry="15" fill="#DAA520"/>
                        <rect x="25" y="19" width="50" height="4" fill="#DC143C" rx="2"/>
                    </svg>
                </div>
                <h1 class="header-title">One Piece Memory</h1>
            </div>
            <div class="header-center">
                <div class="stats-container">
                    <div class="stat-box">
                        <span class="stat-label">Tempo</span>
                        <span id="timer" class="stat-value">00:00</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Movimentos</span>
                        <span id="moves" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Pares</span>
                        <span id="pairs" class="stat-value">0/8</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button id="btn-restart" class="btn-icon" title="Reiniciar">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                </button>
                <button id="btn-menu" class="btn-icon" title="Menu">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="game-main">
            <div class="grid" id="game-grid"></div>
        </main>

        <footer class="game-footer">
            <p>Criado por <strong>AlexandreHBP</strong> | One Piece Memory Game</p>
        </footer>
    </div>

    <!-- Tela de Placar -->
    <div id="leaderboard-screen" class="screen">
        <div class="leaderboard-container">
            <div class="leaderboard-icon">
                <svg viewBox="0 0 100 100" class="crown-svg">
                    <!-- Crown Base -->
                    <rect x="20" y="60" width="60" height="20" fill="#FFD700" stroke="#B8860B" stroke-width="2" rx="3"/>
                    <!-- Crown Points -->
                    <polygon points="20,60 10,35 30,50 50,20 70,50 90,35 80,60" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
                    <!-- Jewels -->
                    <circle cx="50" cy="35" r="6" fill="#DC143C"/>
                    <circle cx="30" cy="45" r="4" fill="#1E90FF"/>
                    <circle cx="70" cy="45" r="4" fill="#1E90FF"/>
                    <!-- Crown Gems on Base -->
                    <circle cx="35" cy="70" r="4" fill="#DC143C"/>
                    <circle cx="50" cy="70" r="4" fill="#32CD32"/>
                    <circle cx="65" cy="70" r="4" fill="#DC143C"/>
                    <!-- Shine -->
                    <ellipse cx="25" cy="65" rx="2" ry="3" fill="rgba(255,255,255,0.5)"/>
                </svg>
            </div>
            <h2 class="leaderboard-title">Melhores Pontuacoes</h2>

            <div class="leaderboard-tabs">
                <button class="tab-btn active" data-tab="easy">Facil</button>
                <button class="tab-btn" data-tab="medium">Medio</button>
                <button class="tab-btn" data-tab="hard">Dificil</button>
            </div>

            <div class="leaderboard-list" id="leaderboard-list">
                <!-- Preenchido via JavaScript -->
            </div>

            <button id="btn-back-menu" class="btn-secondary">
                Voltar ao Menu
            </button>
        </div>
    </div>

    <!-- Modal de Vitoria -->
    <div id="victory-modal" class="modal">
        <div class="modal-content victory-content">
            <div class="confetti-container" id="confetti"></div>
            <div class="victory-icon">
                <svg viewBox="0 0 100 100" class="trophy-svg">
                    <!-- Trophy Cup -->
                    <path d="M 30 25 L 30 50 Q 30 70 50 75 Q 70 70 70 50 L 70 25 Z" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
                    <!-- Trophy Handles -->
                    <path d="M 30 30 Q 15 30 15 45 Q 15 55 30 55" fill="none" stroke="#FFD700" stroke-width="6"/>
                    <path d="M 70 30 Q 85 30 85 45 Q 85 55 70 55" fill="none" stroke="#FFD700" stroke-width="6"/>
                    <!-- Trophy Base -->
                    <rect x="40" y="75" width="20" height="8" fill="#B8860B"/>
                    <rect x="35" y="83" width="30" height="5" fill="#8B4513"/>
                    <rect x="30" y="88" width="40" height="7" fill="#654321"/>
                    <!-- Star on Trophy -->
                    <polygon points="50,35 53,44 63,44 55,50 58,60 50,54 42,60 45,50 37,44 47,44" fill="#fff"/>
                    <!-- Shine -->
                    <ellipse cx="40" cy="40" rx="3" ry="5" fill="rgba(255,255,255,0.5)"/>
                </svg>
            </div>
            <h2 class="victory-title">Parabens!</h2>
            <p class="victory-subtitle">Voce encontrou todos os pares!</p>

            <div class="victory-stats">
                <div class="victory-stat">
                    <span class="victory-stat-value" id="final-time">00:00</span>
                    <span class="victory-stat-label">Tempo</span>
                </div>
                <div class="victory-stat">
                    <span class="victory-stat-value" id="final-moves">0</span>
                    <span class="victory-stat-label">Movimentos</span>
                </div>
            </div>

            <div class="victory-name-input">
                <label for="player-name">Seu nome:</label>
                <input type="text" id="player-name" maxlength="15" placeholder="Jogador">
            </div>

            <div class="victory-buttons">
                <button id="btn-save-score" class="btn-primary">Salvar Pontuacao</button>
                <button id="btn-play-again" class="btn-secondary">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
